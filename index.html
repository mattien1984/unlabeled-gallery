<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>The Unlabeled Gallery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: one gallery wall. The work hangs centred under a picture light; every control is a wall-label card. */
:root {
  --wall: #e2e5e0;
  --wall-2: #d0d6cf;
  --ink: #18221f;
  --ink-2: #54615b;
  --rule: #b7c1ba;
  --card: #fcfcf9;
  --card-ink: #18221f;
  --card-ink-2: #59665f;
  --card-rule: #d7dcd5;
  --accent: #1d5c4f;
  --accent-ink: #f4f7f3;
  --good: #1c7446;
  --bad: #b0372b;
  --good-wall: #1c7446;
  --bad-wall: #b0372b;
  --frame-hi: #403f3a;
  --frame-lo: #151514;
  --light: rgba(255, 255, 255, .6);
  --shadow: rgba(24, 34, 31, .3);
  --font-display: "Bodoni Moda", "Bodoni 72", Didot, "Times New Roman", serif;
  --font-ui: "Hanken Grotesk", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #15332d; --wall-2: #0f2722; --ink: #eef1ea; --ink-2: #a9b9b0; --rule: #2f5048;
    --card: #f3f0e4; --card-ink: #18221f; --card-ink-2: #55615b; --card-rule: #d6d2c2;
    --accent: #d8b168; --accent-ink: #1b1608;
    --good-wall: #86d8a8; --bad-wall: #f29a8f;
    --frame-hi: #e6c47d; --frame-lo: #8a6824;
    --light: rgba(255, 233, 180, .13); --shadow: rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #15332d; --wall-2: #0f2722; --ink: #eef1ea; --ink-2: #a9b9b0; --rule: #2f5048;
  --card: #f3f0e4; --card-ink: #18221f; --card-ink-2: #55615b; --card-rule: #d6d2c2;
  --accent: #d8b168; --accent-ink: #1b1608;
  --good-wall: #86d8a8; --bad-wall: #f29a8f;
  --frame-hi: #e6c47d; --frame-lo: #8a6824;
  --light: rgba(255, 233, 180, .13); --shadow: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  background: radial-gradient(110% 620px at 50% -140px, var(--light), transparent 70%) no-repeat, var(--wall);
  color: var(--ink);
  font: 400 16px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.shell {
  max-width: 1180px; margin: 0 auto;
  padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ---------- shared pieces ---------- */
.kicker { margin: 0; font: 600 .74rem/1.3 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.cta {
  appearance: none; border: 0; cursor: pointer; border-radius: 2px;
  background: var(--accent); color: var(--accent-ink);
  font: 600 1rem/1 var(--font-ui); padding: 16px 24px;
  display: inline-flex; align-items: center; gap: 10px;
  box-shadow: 0 10px 18px -12px var(--shadow);
  transition: transform .12s ease;
  white-space: nowrap;
}
.cta svg { width: 18px; height: 18px; flex: none; }
.cta:hover { transform: translateY(-1px); }
.cta:active { transform: translateY(0); }
.ghost {
  appearance: none; cursor: pointer; border-radius: 2px;
  background: transparent; color: var(--ink); border: 1px solid var(--rule);
  font: 500 .95rem/1 var(--font-ui); padding: 13px 16px;
}
.ghost:hover { border-color: var(--ink-2); }
.frame {
  display: block;
  width: min(100%, calc(var(--maxh, 600px) * var(--ar, 1)));
  padding: clamp(5px, 1vw, 11px);
  background: linear-gradient(145deg, var(--frame-hi), var(--frame-lo) 46%, var(--frame-hi));
  box-shadow: 0 28px 42px -24px var(--shadow), 0 3px 8px -2px var(--shadow);
}
.canvas {
  display: block; position: relative; overflow: hidden;
  aspect-ratio: var(--ar, 1); background: var(--wall-2);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .4);
}
.canvas img {
  display: block; width: 100%; height: 100%; object-fit: cover;
  transform-origin: var(--fx, 50%) var(--fy, 50%);
  transform: scale(var(--z, 1));
  transition: transform 1.15s cubic-bezier(.2, .7, .15, 1);
}

/* ---------- top bar ---------- */
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding-bottom: 12px; margin-bottom: clamp(18px, 3vw, 34px);
  border-bottom: 1px solid var(--rule);
}
.wordmark { font: italic 500 1.12rem/1.1 var(--font-display); margin: 0; }
.pips { display: flex; gap: 5px; align-items: center; }
.pip {
  width: 13px; height: 17px; border: 1.5px solid var(--ink-2); border-radius: 1px;
  background: linear-gradient(to top, var(--accent) var(--fill, 0%), transparent var(--fill, 0%));
}
.pip.is-done { border-color: var(--accent); }
.pip.is-now { border-color: var(--ink); box-shadow: 0 0 0 2px var(--wall), 0 0 0 3.5px var(--ink); }
.bar-right { display: flex; align-items: center; gap: 14px; }
.tally { font: 600 1rem/1 var(--font-ui); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tally small { font-weight: 400; color: var(--ink-2); font-size: .85em; }
.quit { appearance: none; background: none; border: 0; padding: 6px 2px; cursor: pointer; font: 500 .85rem/1 var(--font-ui); color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; }
.quit:hover { color: var(--ink); }
.quit-ask { display: flex; gap: 10px; align-items: center; font-size: .85rem; color: var(--ink-2); }

/* ---------- lobby ---------- */
.lobby { display: grid; gap: clamp(26px, 4.5vw, 52px); }
.hang {
  --h: clamp(70px, 17vw, 215px);
  display: flex; align-items: flex-end; justify-content: center;
  gap: clamp(14px, 3vw, 38px); padding-top: clamp(6px, 2vw, 22px); overflow: hidden;
}
.hang figure { margin: 0; flex: none; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 6px; }
.hang figure:nth-child(1) { --k: .72; }
.hang figure:nth-child(2) { --k: .95; }
.hang figure:nth-child(3) { --k: 1.12; }
.hang figure:nth-child(4) { --k: .86; }
.hang figure:nth-child(5) { --k: .66; }
.hang .frame { width: auto; padding: clamp(4px, .7vw, 8px); }
.hang .canvas { height: calc(var(--h) * var(--k, 1)); }
.blank {
  width: 46px; height: 24px; display: grid; place-items: center;
  background: var(--card); color: var(--card-ink-2);
  font: italic 500 .95rem/1 var(--font-display);
  box-shadow: 0 6px 10px -6px var(--shadow), 0 1px 2px var(--shadow);
}
.lobby-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.intro { display: grid; gap: 18px; min-width: 0; }
.title { margin: 0; font: 500 clamp(2.7rem, 7.4vw, 5.2rem)/.98 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
.title em { font-style: italic; font-weight: 400; }
.lede { margin: 0; max-width: 34em; font-size: 1.08rem; line-height: 1.55; }
.start { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 6px; }
.meta { margin: 0; color: var(--ink-2); font-size: .92rem; }
.best { margin: 0; font-size: .95rem; color: var(--ink-2); }
.best b { color: var(--ink); font-variant-numeric: tabular-nums; }
.level { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; max-width: 31rem; }
.lvl {
  appearance: none; cursor: pointer; text-align: left;
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 2px 11px;
  padding: 11px 14px; border-radius: 2px;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-rule);
  box-shadow: 0 8px 14px -11px var(--shadow);
}
.lvl::before { content: ""; grid-row: 1 / span 2; width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--card-ink-2); }
.lvl.is-on { border-color: var(--card-ink); box-shadow: 0 0 0 1px var(--card-ink), 0 8px 14px -11px var(--shadow); }
.lvl.is-on::before { border-color: var(--card-ink); background: radial-gradient(circle, var(--card-ink) 0 44%, transparent 50%); }
.lvl b { grid-column: 2; font: 600 .98rem/1.3 var(--font-ui); }
.lvl span { grid-column: 2; font-size: .84rem; line-height: 1.3; color: var(--card-ink-2); }
.skills { display: grid; gap: 12px; min-width: 0; }
.skill-list { display: grid; gap: 8px; }
.skill {
  appearance: none; cursor: pointer; text-align: left; width: 100%;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 14px;
  padding: 12px 16px; border-radius: 2px;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-rule);
  box-shadow: 0 8px 14px -11px var(--shadow);
  transition: transform .12s ease;
}
.skill:hover { transform: translateX(3px); }
.skill b { font: 600 1rem/1.3 var(--font-ui); }
.skill span { grid-column: 1; font-size: .88rem; line-height: 1.35; color: var(--card-ink-2); }
.skill svg { grid-column: 2; grid-row: 1 / span 2; width: 18px; height: 18px; color: var(--card-ink-2); }
.credits { border-top: 1px solid var(--rule); padding-top: 16px; font-size: .84rem; color: var(--ink-2); max-width: 70ch; }
.credits a { color: inherit; }

/* ---------- play ---------- */
.room { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: clamp(24px, 4vw, 60px); align-items: start; }
.stage { --maxh: min(64vh, 640px); display: flex; flex-direction: column; align-items: center; gap: 16px; min-width: 0; }
.plate {
  margin: 0; padding: 7px 12px; max-width: 100%;
  background: var(--card); color: var(--card-ink-2);
  font: 500 .8rem/1.3 var(--font-ui); text-align: center;
  box-shadow: 0 6px 10px -6px var(--shadow), 0 1px 2px var(--shadow);
}
.plate i { font: italic 500 .95rem/1.2 var(--font-display); color: var(--card-ink); }
.lineup { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(10px, 2vw, 20px); width: min(100%, 620px); }
.tile {
  appearance: none; background: none; border: 0; padding: 0; cursor: pointer;
  position: relative; display: grid; place-items: center; aspect-ratio: 1;
}
.tile .frame { width: min(100%, calc(100% * var(--ar, 1))); padding: clamp(4px, .8vw, 8px); transition: transform .15s ease; }
.tile:not([disabled]):hover .frame { transform: translateY(-3px); }
.tile[disabled] { cursor: default; }
.tile-key {
  position: absolute; left: 0; top: 0; min-width: 26px; height: 26px; padding: 0 7px;
  display: grid; place-items: center;
  background: var(--card); color: var(--card-ink); font: 600 .8rem/1 var(--font-ui);
  box-shadow: 0 4px 8px -4px var(--shadow), 0 1px 2px var(--shadow);
}
.slot { min-width: 0; }
.tile { width: 100%; }
.tile-cap {
  margin: 10px 0 0; padding: 5px 8px; min-height: 1.9em;
  font: 600 .78rem/1.25 var(--font-ui); text-align: center; color: transparent;
}
.tile-cap.is-on { background: var(--card); color: var(--card-ink); box-shadow: 0 4px 8px -4px var(--shadow), 0 1px 2px var(--shadow); }
.tile.is-right .tile-key { background: var(--good); color: #fff; }
.tile.is-wrong .tile-key { background: var(--bad); color: #fff; }
.tile.is-dim .frame { opacity: .55; }

.panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.prompt { margin: 0; font: 500 clamp(1.75rem, 3.5vw, 2.5rem)/1.08 var(--font-display); letter-spacing: -.01em; text-wrap: balance; }
.prompt em { font-style: italic; }
.hint { margin: 0; color: var(--ink-2); font-size: .92rem; }
.options { display: grid; gap: 9px; }
.opt {
  appearance: none; cursor: pointer; text-align: left; width: 100%;
  display: flex; align-items: center; gap: 14px;
  padding: 13px 16px; border-radius: 2px;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-rule);
  font: 500 1.03rem/1.25 var(--font-ui);
  box-shadow: 0 8px 14px -11px var(--shadow);
  transition: transform .12s ease;
}
.opt:hover { transform: translateX(3px); }
.opt .key { flex: none; width: 1.7em; height: 1.7em; display: grid; place-items: center; border: 1px solid var(--card-rule); font: 600 .76rem/1 var(--font-ui); color: var(--card-ink-2); }
.opt .txt { min-width: 0; }
.opt.is-title .txt { font: italic 500 1.16rem/1.2 var(--font-display); }
.loupe { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.worth { margin: 0; font-size: .92rem; color: var(--ink-2); }
.worth b { color: var(--ink); font-variant-numeric: tabular-nums; }
.typed { display: grid; gap: 10px; }
.field-label { font: 600 .74rem/1.3 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.typed-row { display: flex; gap: 8px; }
.name-input {
  flex: 1 1 auto; min-width: 0; padding: 14px 16px; border-radius: 2px;
  background: var(--card); color: var(--card-ink); border: 1px solid var(--card-rule);
  font: 500 1.08rem/1.2 var(--font-ui);
  box-shadow: 0 8px 14px -11px var(--shadow);
}
.name-input::placeholder { color: var(--card-ink-2); opacity: .85; }
.typed-alt { display: flex; flex-wrap: wrap; gap: 8px; }

.dating { display: grid; gap: 10px; }
.year-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.year { font: 500 clamp(3.4rem, 9vw, 5rem)/.95 var(--font-display); font-variant-numeric: lining-nums tabular-nums; letter-spacing: -.02em; }
.century { color: var(--ink-2); font-size: .95rem; }
.yr { -webkit-appearance: none; appearance: none; width: 100%; height: 30px; margin: 0; background: transparent; cursor: pointer; }
.yr::-webkit-slider-runnable-track { height: 2px; background: var(--ink-2); }
.yr::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; margin-top: -11px; border-radius: 50%; background: var(--accent); border: 3px solid var(--wall); box-shadow: 0 0 0 1.5px var(--accent); }
.yr::-moz-range-track { height: 2px; background: var(--ink-2); }
.yr::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--wall); box-shadow: 0 0 0 1.5px var(--accent); }
.scale { position: relative; height: 18px; margin: 0 12px; font: 500 .72rem/1 var(--font-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.scale span { position: absolute; top: 0; transform: translateX(-50%); }
.nudge { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.nudge .ghost { padding: 10px 12px; min-width: 52px; font-variant-numeric: tabular-nums; }
.nudge .cta { margin-left: auto; }

.verdict { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.verdict .word { display: inline-flex; align-items: center; gap: 8px; font: 700 1.1rem/1.2 var(--font-ui); }
.verdict .word svg { width: 20px; height: 20px; }
.verdict .pts { font: 600 1rem/1 var(--font-ui); font-variant-numeric: tabular-nums; color: var(--ink-2); }
.is-good { color: var(--good-wall); }
.is-bad { color: var(--bad-wall); }
.is-mid { color: var(--ink); }
.said { margin: -6px 0 0; color: var(--ink-2); font-size: .95rem; }
.said i { font-family: var(--font-display); font-size: 1.05em; }
.span-track { position: relative; height: 54px; margin: 2px 12px 0; }
.span-track::before { content: ""; position: absolute; left: 0; right: 0; top: 26px; height: 2px; background: var(--rule); }
.span-track .mark { position: absolute; top: 20px; width: 2px; height: 14px; background: var(--ink); }
.span-track .mark b { position: absolute; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 .74rem/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.span-track .mark.you b { bottom: 18px; color: var(--ink-2); }
.span-track .mark.you { background: var(--ink-2); }
.span-track .mark.real b { top: 19px; color: var(--accent); }
.span-track .mark.real { background: var(--accent); width: 3px; }

.tomb {
  display: grid; gap: 2px; max-width: 34rem; padding: 18px 20px 16px; border-radius: 2px;
  background: var(--card); color: var(--card-ink);
  box-shadow: 0 16px 24px -18px var(--shadow), 0 1px 2px var(--shadow);
}
.tomb p { margin: 0; }
.tomb .who { font: 700 1.06rem/1.25 var(--font-ui); }
.tomb .life { font-size: .9rem; color: var(--card-ink-2); margin-bottom: 9px; }
.tomb .what { font: italic 500 1.4rem/1.18 var(--font-display); text-wrap: balance; }
.tomb .what span { font: 400 1rem/1.2 var(--font-ui); white-space: nowrap; }
.tomb .where { font-size: .9rem; color: var(--card-ink-2); margin-top: 3px; }
.tomb .tell { margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--card-rule); font-size: .93rem; line-height: 1.45; }
.tomb .tell b { display: block; margin-bottom: 3px; font: 600 .68rem/1.2 var(--font-ui); letter-spacing: .13em; text-transform: uppercase; color: var(--card-ink-2); }
.tomb .src { margin-top: 10px; font-size: .76rem; }
.tomb .src a { color: var(--card-ink-2); }
.next-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.keyhint { color: var(--ink-2); font-size: .82rem; }

/* ---------- finale ---------- */
.finale { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: clamp(28px, 5vw, 72px); align-items: start; }
.result { display: grid; gap: 14px; min-width: 0; }
.score { margin: 0; font: 500 clamp(4.2rem, 13vw, 8rem)/.9 var(--font-display); letter-spacing: -.03em; font-variant-numeric: lining-nums tabular-nums; }
.score small { font: 400 1.1rem/1 var(--font-ui); letter-spacing: 0; color: var(--ink-2); margin-left: 8px; }
.rank { margin: 0; font: italic 500 clamp(1.6rem, 3.4vw, 2.2rem)/1.1 var(--font-display); }
.rank-line { margin: 0; max-width: 30em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.recap { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.recap li {
  display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 4px 14px;
  padding: 10px 14px 10px 10px; border-radius: 2px;
  background: var(--card); color: var(--card-ink);
  box-shadow: 0 8px 14px -11px var(--shadow);
}
.recap .thumb { grid-row: 1 / span 2; width: 56px; height: 56px; object-fit: cover; display: block; background: var(--card-rule); }
.recap .rt { font: italic 500 1.08rem/1.2 var(--font-display); min-width: 0; }
.recap .ra { grid-column: 2; font-size: .84rem; line-height: 1.3; color: var(--card-ink-2); min-width: 0; }
.recap .rp { grid-column: 3; grid-row: 1 / span 2; text-align: right; font: 700 1rem/1.2 var(--font-ui); font-variant-numeric: tabular-nums; }
.recap .rp small { display: block; font: 500 .7rem/1.3 var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--card-ink-2); }
.recap .rp.zero { color: var(--bad); }
.recap .rp.full { color: var(--good); }

@media (max-width: 860px) {
  .room, .lobby-grid, .finale { grid-template-columns: minmax(0, 1fr); }
  .stage { --maxh: min(42vh, 420px); }
  .wordmark, .keyhint, .hint { display: none; }
  .hang figure:nth-child(1), .hang figure:nth-child(5) { display: none; }
  .nudge .cta { margin-left: 0; width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

// Every accepted spelling per artist: full name, surname (with particles), first name + surname, plus the extras above.

function editDistance(a, b) {

  $$('img[data-fade]', root).forEach(im => {
    const on = () => im.classList.add('is-in');
    if (im.complete && im.naturalWidth) on(); else { im.addEventListener('load', on, { once: true }); im.addEventListener('error', on, { once: true }); }
  });
}
function render() {
  const app = $('#app');
  if (S.screen === 'lobby') app.innerHTML = lobbyHTML();
  else if (S.screen === 'finale') app.innerHTML = finaleHTML();
  else {
    app.innerHTML = '<header class="bar" id="bar"></header><main class="room"><section class="stage" id="stage"></section><section class="panel" id="panel" aria-live="polite"></section></main>';
    paintBar(); paintStage(); paintPanel();
  }
  fadeIn(app);
}
function lobbyHTML() {
  const best = store.get(bestKey(S.hard), 0);
  const years = W.map(w => w.year);
  return `
  <div class="lobby">
    <div class="hang" aria-hidden="true">
      ${S.hero.map(i => `<figure style="--ar:${W[i].ar}"><span class="frame"><span class="canvas"><img data-fade src="${img(W[i])}" alt=""></span></span><span class="blank">?</span></figure>`).join('')}
    </div>
    <div class="lobby-grid">
      <div class="intro">
        <p class="kicker">An art history game</p>
        <h1 class="title">The <em>Unlabeled</em> Gallery</h1>
        <p class="lede">Overnight, every wall label in the museum went missing. ${W.length} works by ${A.length} artists, made between ${Math.min(...years)} and ${Math.max(...years)}, now hang without a name, a maker or a date. Put the labels back.</p>
        <div class="level" role="group" aria-label="Difficulty">
          <button class="lvl ${S.hard ? '' : 'is-on'}" data-act="level" data-v="0" aria-pressed="${!S.hard}"><b>Medium</b><span>Pick the artist from four</span></button>
          <button class="lvl ${S.hard ? 'is-on' : ''}" data-act="level" data-v="1" aria-pressed="${S.hard}"><b>Hard</b><span>Type the artist’s name</span></button>
        </div>
        <div class="start">
          <button class="cta" data-act="start" data-v="tour">Start a tour ${ICON.go}</button>
          <p class="meta">10 works · 6 kinds of question · 1,000 points</p>
        </div>
        ${best ? `<p class="best">Your best ${S.hard ? 'Hard' : 'Medium'} tour so far: <b>${best}</b> points, ranked ${esc(rank(best).name)}.</p>` : ''}
      </div>
      <div class="skills">
        <h2 class="kicker">Or practise one skill for ten works</h2>
        <div class="skill-list">
          ${Object.entries(TYPES).map(([k, t]) => `<button class="skill" data-act="start" data-v="${k}"><b>${t.name}</b><span>${S.hard && t.hard ? t.hard : t.blurb}</span>${ICON.go}</button>`).join('')}
        </div>
      </div>
    </div>
    <p class="credits">Every image is a public-domain reproduction from <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>, and each answer links to its source file. Dates and locations follow the holding museums; a date marked c. is approximate.</p>
  </div>`;
}
function paintBar() {
  const n = S.rounds.length;
  $('#bar').innerHTML = `
    <p class="wordmark">The Unlabeled Gallery</p>
    <div class="pips" role="img" aria-label="Work ${S.i + 1} of ${n}">
      ${S.rounds.map((r, k) => `<i class="pip ${r.done ? 'is-done' : ''} ${k === S.i ? 'is-now' : ''}" style="--fill:${r.done ? r.pts : 0}%"></i>`).join('')}
    </div>
    <div class="bar-right">
      ${S.quitAsk
        ? `<span class="quit-ask">Leave this tour? <button class="quit" data-act="quit-yes">Leave</button> <button class="quit" data-act="quit-no">Stay</button></span>`
        : `<button class="quit" data-act="quit">Quit</button>`}
      <span class="tally">${score()} <small>pts</small></span>
    </div>`;
}
function paintStage() {
  const r = cur(), w = W[r.w], st = $('#stage');
  if (r.type === 'lineup') {
    st.innerHTML = `<div class="lineup">${r.opts.map((i, k) => `
      <div class="slot">
        <button class="tile" data-act="pick" data-v="${k}" style="--ar:${W[i].ar}" aria-label="Painting ${k + 1}">
          <span class="frame"><span class="canvas"><img data-fade src="${img(W[i])}" alt="Painting ${k + 1}"></span></span>
          <span class="tile-key">${k + 1}</span>
        </button>
        <p class="tile-cap">&nbsp;</p>
      </div>`).join('')}</div>`;
  } else {
    const z = r.type === 'detail' && !r.done ? ZOOMS[r.zoom] : 1;
    st.innerHTML = `
      <div class="frame" style="--ar:${w.ar}"><div class="canvas" id="canvas" style="--z:${z};--fx:${r.fx || 50}%;--fy:${r.fy || 50}%"><img data-fade id="work" src="${img(w)}" alt="The work to identify"></div></div>
      <p class="plate" id="plate">Work ${S.i + 1} · label missing</p>`;
  }
  fadeIn(st);
  if (r.done) markStage();
  const nx = S.rounds[S.i + 1];
  if (nx) (nx.type === 'lineup' ? nx.opts : [nx.w]).forEach(i => { const p = new Image(); p.src = img(W[i]); });
}
function markStage() {
  const r = cur(), w = W[r.w];
  if (r.type === 'lineup') {
    $$('.slot').forEach((s, k) => {
      const t = $('.tile', s), cap = $('.tile-cap', s);
      t.disabled = true;
      t.classList.add(k === r.ans ? 'is-right' : k === r.pick ? 'is-wrong' : 'is-dim');
      cap.textContent = A[W[r.opts[k]].a].name;
      cap.classList.add('is-on');
    });
    return;
  }
  const c = $('#canvas'); if (c) c.style.setProperty('--z', 1);
  const im = $('#work'); if (im) im.alt = w.title + ' by ' + A[w.a].name;
  const pl = $('#plate'); if (pl) pl.innerHTML = `<i>${esc(w.title)}</i> · ${esc(A[w.a].name)}`;
}
function tombHTML(w) {
  const a = A[w.a];
  const file = 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(w.src.replace(/ /g, '_'));
  return `
  <article class="tomb">
    <p class="who">${esc(a.name)}</p>
    <p class="life">${esc(a.nat)}, ${esc(a.life)} · ${esc(a.move)}</p>
    <p class="what">${esc(w.title)}<span>, ${when(w)}</span></p>
    <p class="where">${esc(w.loc)}</p>
    <p class="tell"><b>How to spot the artist</b>${esc(a.tell)}</p>
    <p class="src"><a href="${file}" target="_blank" rel="noopener">Image source: Wikimedia Commons</a></p>
  </article>`;
}
function optionsHTML(r, label, cls) {
  return `<div class="options">${r.opts.map((o, k) => `<button class="opt ${cls || ''}" data-act="pick" data-v="${k}"><span class="key">${k + 1}</span><span class="txt">${esc(label(o))}</span></button>`).join('')}</div>`;
}
function typedHTML(r) {
  return `
    <form class="typed" id="typed-form" novalidate>
      <label class="field-label" for="artist-input">Artist</label>
      <div class="typed-row">
        <input class="name-input" id="artist-input" name="artist" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="A surname is enough" value="${esc(r.text || '')}">
        <button class="cta" type="submit">Submit</button>
      </div>
      <div class="typed-alt">
        <button class="ghost" type="button" data-act="show-opts">Show four choices for ${Math.round(worthNow(r) / 2)}</button>
        <button class="ghost" type="button" data-act="pass">I don’t know</button>
      </div>
    </form>`;
}
function focusInput() { const inp = $('#artist-input'); if (inp && !narrow()) inp.focus({ preventScroll: true }); }
function paintPanel() {
  const r = cur(), w = W[r.w], a = A[w.a], n = S.rounds.length, t = TYPES[r.type];
  const kicker = `<p class="kicker">${t.name} · Work ${S.i + 1} of ${n}</p>`;
  const typing = r.typed && !r.showOpts;
  let h = '';
  if (!r.done) {
    if (r.type === 'attr') h = `<h2 class="prompt">Who painted this?</h2>` + (typing ? typedHTML(r) : optionsHTML(r, o => A[o].name))
      + (r.typed && r.showOpts ? `<p class="worth">With the choices showing, a correct answer is worth <b>${worthNow(r)}</b>.</p>` : '');
    else if (r.type === 'title') h = `<h2 class="prompt">What is this work called?</h2>` + optionsHTML(r, o => W[o].title, 'is-title');
    else if (r.type === 'move') h = `<h2 class="prompt">Which movement does this belong to?</h2>` + optionsHTML(r, o => o);
    else if (r.type === 'detail') {
      h = `<h2 class="prompt">Whose hand is this detail from?</h2>` + (typing ? typedHTML(r) : optionsHTML(r, o => A[o].name)) + `
        <div class="loupe">
          <p class="worth">A correct answer from here is worth <b>${worthNow(r)}</b>.</p>
          ${r.zoom < 2 ? `<button class="ghost" data-act="zoom">Step back for ${worthAt(r, r.zoom + 1)}</button>` : ''}
        </div>`;
    } else if (r.type === 'lineup') {
      h = `<h2 class="prompt">Which of these is by <em>${esc(a.name)}</em>?</h2><p class="hint">Choose a painting, or press 1 to 4.</p>`;
    } else if (r.type === 'date') {
      const ticks = [1300, 1400, 1500, 1600, 1700, 1800, 1900];
      h = `<h2 class="prompt">When was this made?</h2>
        <div class="dating">
          <div class="year-row"><output class="year" id="year-out" for="year-range">${r.guess}</output><span class="century" id="year-century">${century(r.guess)}</span></div>
          <input class="yr" type="range" id="year-range" min="${Y0}" max="${Y1}" step="1" value="${r.guess}" aria-label="Year">
          <div class="scale" aria-hidden="true">${ticks.map(y => `<span style="left:${(y - Y0) / (Y1 - Y0) * 100}%">${y}</span>`).join('')}</div>
          <div class="nudge">
            ${[-10, -1, 1, 10].map(d => `<button class="ghost" data-act="nudge" data-v="${d}" aria-label="${d > 0 ? 'Later' : 'Earlier'} by ${Math.abs(d)}">${d > 0 ? '+' : '−'}${Math.abs(d)}</button>`).join('')}
            <button class="cta" data-act="lock" id="lock"><span>Lock in <span id="lock-year">${r.guess}</span></span></button>
          </div>
        </div>`;
    }
  } else {
    let word, cls, said = '';
    if (r.type === 'date') {
      const off = r.guess - w.year, abs = Math.abs(off);
      word = r.pts === 100 ? 'Spot on' : r.pts >= 70 ? 'Close' : r.pts >= 30 ? 'Right neighbourhood' : 'Wrong era';
      cls = r.pts >= 70 ? 'is-good' : r.pts >= 30 ? 'is-mid' : 'is-bad';
      said = `<p class="said">You said ${r.guess}. It was made ${when(w)}${abs ? `, ${abs} year${abs === 1 ? '' : 's'} ${off > 0 ? 'earlier' : 'later'}` : ''}.</p>
        <div class="span-track" role="img" aria-label="Your guess ${r.guess}, actual date ${w.year}">
          <span class="mark you" style="left:${(r.guess - Y0) / (Y1 - Y0) * 100}%"><b>You ${r.guess}</b></span>
          <span class="mark real" style="left:${(w.year - Y0) / (Y1 - Y0) * 100}%"><b>Made ${w.year}</b></span>
        </div>`;
    } else {
      const ok = typing ? !!r.ok : r.pick === r.ans;
      word = ok ? 'Correct' : 'Not this time';
      cls = ok ? 'is-good' : 'is-bad';
      if (!ok && typing) said = r.pass ? `<p class="said">You passed on this one.</p>` : `<p class="said">You typed “${esc(r.text)}”.</p>`;
      else if (!ok) {
        const o = r.opts[r.pick];
        said = r.type === 'title' ? `<p class="said">You chose <i>${esc(W[o].title)}</i>, by ${esc(A[W[o].a].name)}.</p>`
          : r.type === 'lineup' ? `<p class="said">You picked no. ${r.pick + 1}, <i>${esc(W[o].title)}</i> by ${esc(A[W[o].a].name)}. The answer is no. ${r.ans + 1}.</p>`
          : r.type === 'move' ? `<p class="said">You chose ${esc(o)}. This is ${esc(r.opts[r.ans])}.</p>`
          : `<p class="said">You chose ${esc(A[o].name)}.</p>`;
      } else if (r.type === 'move') said = `<p class="said">${esc(r.opts[r.ans])}.</p>`;
    }
    const last = S.i === n - 1;
    h = `<div class="verdict"><span class="word ${cls}">${cls === 'is-bad' ? ICON.no : ICON.ok}${word}</span><span class="pts">+${r.pts} points</span></div>
      ${said}${tombHTML(w)}
      <div class="next-row"><button class="cta" data-act="next" id="next">${last ? 'See your results' : 'Next work'} ${ICON.go}</button><span class="keyhint">or press Enter</span></div>`;
  }
  $('#panel').innerHTML = kicker + h;
  if (!r.done) focusInput();
}
function finaleHTML() {
  const s = score(), rk = rank(s), max = S.rounds.length * 100;
  return `
  <header class="bar"><p class="wordmark">The Unlabeled Gallery</p><span class="tally">${S.mode === 'tour' ? 'Full tour' : TYPES[S.mode].name + ' practice'}${S.tourHard ? ' · Hard' : ''}</span></header>
  <div class="finale">
    <div class="result">
      <p class="kicker">${S.newBest ? 'Tour complete · a new personal best' : 'Tour complete'}</p>
      <p class="score">${s}<small>/ ${max.toLocaleString('en-US')}</small></p>
      <p class="rank">${esc(rk.name)}</p>
      <p class="rank-line">${esc(rk.line)}</p>
      <div class="actions">
        <button class="cta" data-act="start" data-v="${S.mode}" id="again">${S.mode === 'tour' ? 'Start a new tour' : 'Ten more'} ${ICON.go}</button>
        <button class="ghost" data-act="lobby">Back to the lobby</button>
      </div>
    </div>
    <ol class="recap">
      ${S.rounds.map(r => { const w = W[r.w]; return `<li>
        <img class="thumb" src="${img(w)}" alt="">
        <span class="rt">${esc(w.title)}</span>
        <span class="ra">${esc(A[w.a].name)}, ${when(w)}</span>
        <span class="rp ${r.pts === 0 ? 'zero' : r.pts === 100 ? 'full' : ''}">+${r.pts}<small>${TYPES[r.type].name}</small></span>
      </li>`; }).join('')}
    </ol>
  </div>`;
}

/* ---------- actions ---------- */
const narrow = () => window.innerWidth < 860;
function toTop() { try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { window.scrollTo(0, 0); } }
function start(mode) {
  S.mode = mode; S.rounds = newTour(mode); S.i = 0; S.screen = 'play'; S.quitAsk = false; S.newBest = false; S.tourHard = S.hard;
  render(); toTop();
}
function settle() {
  markStage(); paintPanel(); paintBar();
  const nx = $('#next');
  if (nx) nx.focus({ preventScroll: true });
  if (narrow()) $('#panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function choose(k) {
  const r = cur();
  if (!r || r.done || r.type === 'date' || (r.typed && !r.showOpts) || !(k >= 0 && k < r.opts.length)) return;
  r.pick = k; r.done = true;
  r.pts = k === r.ans ? worthNow(r) : 0;
  settle();
}
function submitTyped(pass) {
  const r = cur();
  if (!r || r.done || !r.typed || r.showOpts) return;
  const inp = $('#artist-input'), text = inp ? inp.value.trim() : '';
  if (!pass && !text) { if (inp) inp.focus(); return; }
  r.text = text; r.pass = !!pass;
  r.ok = !pass && whoIs(text) === W[r.w].a;
  r.done = true;
  r.pts = r.ok ? worthNow(r) : 0;
  settle();
}
function lock() {
  const r = cur();
  if (!r || r.done || r.type !== 'date') return;
  r.guess = +$('#year-range').value;
  r.pts = dateScore(W[r.w].year, r.guess);
  r.done = true;
  settle();
}
function setYear(y) {
  const r = cur();
  y = Math.max(Y0, Math.min(Y1, y));
  r.guess = y;
  $('#year-range').value = y;
  $('#year-out').textContent = y;
  $('#lock-year').textContent = y;
  $('#year-century').textContent = century(y);
}
function next() {
  if (S.i < S.rounds.length - 1) { S.i++; S.quitAsk = false; paintBar(); paintStage(); paintPanel(); toTop(); }
  else {
    S.screen = 'finale';
    if (S.mode === 'tour') { const key = bestKey(S.tourHard), b = store.get(key, 0); S.newBest = score() > b; if (S.newBest) store.set(key, score()); }
    render(); toTop();
    const ag = $('#again'); if (ag) ag.focus({ preventScroll: true });
  }
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'start') start(v);
  else if (act === 'pick') choose(+v);
  else if (act === 'zoom') { const r = cur(); if (!r.done && r.zoom < 2) { const inp = $('#artist-input'); if (inp) r.text = inp.value; r.zoom++; $('#canvas').style.setProperty('--z', ZOOMS[r.zoom]); paintPanel(); } }
  else if (act === 'show-opts') { const r = cur(); if (!r.done && r.typed) { r.showOpts = true; paintPanel(); } }
  else if (act === 'pass') submitTyped(true);
  else if (act === 'level') { S.hard = v === '1'; store.set('ug.hard', S.hard); render(); const on = $('.lvl.is-on'); if (on) on.focus({ preventScroll: true }); }
  else if (act === 'nudge') setYear(+$('#year-range').value + +v);
  else if (act === 'lock') lock();
  else if (act === 'next') next();
  else if (act === 'quit') { S.quitAsk = true; paintBar(); }
  else if (act === 'quit-no') { S.quitAsk = false; paintBar(); }
  else if (act === 'quit-yes' || act === 'lobby') { S.screen = 'lobby'; S.hero = pickHero(); render(); toTop(); }
});
document.addEventListener('input', e => { if (e.target.id === 'year-range') setYear(+e.target.value); });
document.addEventListener('submit', e => { if (e.target.id === 'typed-form') { e.preventDefault(); submitTyped(false); } });
document.addEventListener('keydown', e => {
  if (S.screen !== 'play' || e.metaKey || e.ctrlKey || e.altKey) return;
  const r = cur(), tag = (document.activeElement && document.activeElement.tagName) || '';
  if (!r.done && /^[1-4]$/.test(e.key) && r.type !== 'date' && !(r.typed && !r.showOpts)) { e.preventDefault(); choose(+e.key - 1); }
  else if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'A') {
    if (r.done) { e.preventDefault(); next(); }
    else if (r.type === 'date') { e.preventDefault(); lock(); }
  }
});

/* ---------- boot ---------- */
function boot(data) {
  const saved = data && data.S;
  if (saved && saved.v === D.v && Array.isArray(saved.rounds) && saved.rounds.every(r => W[r.w])) S = saved;
  if (!S.hero || S.hero.length !== 5) S.hero = pickHero();
  render();
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ S })); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body>
</html>
